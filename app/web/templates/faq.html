{% extends "base.html" %}
{% block content %}
{% if can("create") %}
<form class="form" hx-post="/faq" hx-target="#faq-rows" hx-swap="afterbegin" hx-on::after-request="if (event.detail.successful) this.reset()">
  <h2>Add FAQ</h2>
  <label>Question <input name="question" required value="{{ prefill }}"></label>
  <label>Answer <textarea name="answer" rows="3" required></textarea></label>
  <div class="row">
    <label>Category
      <select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select>
    </label>
    <label>Language
      <select name="language"><option value="en">English</option><option value="km">Khmer</option></select>
    </label>
    <label>Keywords (comma separated) <input name="keywords" placeholder="price, cost"></label>
  </div>
  <label class="narrow">Priority <input type="number" name="priority" value="0" min="0" max="100"></label>
  <button type="submit">Add FAQ</button>
</form>
{% endif %}

<form method="get" class="toolbar">
  <input type="search" name="q" value="{{ q }}" placeholder="Search questions, answers, keywords">
  <select name="category"><option value="">All categories</option>
    {% for c in categories %}<option {{ "selected" if c == category else "" }}>{{ c }}</option>{% endfor %}
  </select>
  <button type="submit">Filter</button>
</form>

<div class="table-wrap">
<table>
  <thead><tr><th>Question</th><th>Answer</th><th>Category</th><th>Lang</th><th>Keywords</th><th>Status</th><th></th></tr></thead>
  <tbody id="faq-rows">
    {% for f in faqs %}{% include "_faq_row.html" %}{% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
