{% extends "base.html" %}
{% block content %}
<form method="get" class="toolbar">
  <input type="search" name="q" value="{{ q }}" placeholder="Search name, username, phone or email">
  <select name="status"><option value="">All statuses</option>
    {% for s in statuses %}<option {{ "selected" if s == status else "" }}>{{ s }}</option>{% endfor %}
  </select>
  <button type="submit">Search</button>
</form>
{% if not show_pii %}<p class="muted small">Personal data is masked for your role.</p>{% endif %}
<div class="table-wrap">
<table>
  <thead><tr><th>ID</th><th>Name</th><th>Username</th><th>Phone</th><th>Email</th><th>Language</th><th>Last seen</th><th>Status</th></tr></thead>
  <tbody>
    {% for u in users %}{% include "_user_row.html" %}{% else %}
    <tr><td colspan="8" class="muted">No users yet. Send /start to your bot.</td></tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
