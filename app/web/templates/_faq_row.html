<tr id="faq-{{ f.id }}" class="{{ 'inactive' if f.status != 'Active' else '' }}">
  <td>{{ f.question }}</td>
  <td>{{ f.answer }}</td>
  <td>{{ f.category }}</td>
  <td>{{ f.language }}</td>
  <td>{{ f.keywords }}</td>
  <td><span class="badge">{{ f.status }}</span></td>
  <td class="actions">
    {% if can("edit") %}<button class="small secondary" hx-post="/faq/{{ f.id }}/toggle" hx-target="#faq-{{ f.id }}" hx-swap="outerHTML">{{ "Disable" if f.status == "Active" else "Enable" }}</button>{% endif %}
    {% if can("delete") %}<button class="danger" hx-delete="/faq/{{ f.id }}" hx-target="#faq-{{ f.id }}" hx-swap="outerHTML"
              hx-confirm="Delete this FAQ?">Delete</button>{% endif %}
  </td>
</tr>
