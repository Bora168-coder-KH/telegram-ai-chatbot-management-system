<tr id="user-{{ u.id }}">
  <td>{{ u.id }}</td>
  <td>{{ u.full_name | pii("name", show_pii) }}</td>
  <td>{{ u.username | pii("username", show_pii) }}</td>
  <td>{{ u.phone | pii("phone", show_pii) }}</td>
  <td>{{ u.email | pii("email", show_pii) }}</td>
  <td>{{ u.language }}</td>
  <td>{{ u.last_interaction_at | localtime }}</td>
  <td>
    {% if can("edit") %}
    <form hx-post="/users/{{ u.id }}/status" hx-target="#user-{{ u.id }}" hx-swap="outerHTML" hx-trigger="change">
      <select name="status" class="status-{{ u.status|lower }}" aria-label="Status">
        {% for s in statuses %}<option value="{{ s }}" {{ "selected" if s == u.status else "" }}>{{ s }}</option>{% endfor %}
      </select>
    </form>
    {% else %}<span class="badge status-{{ u.status|lower }}">{{ u.status }}</span>{% endif %}
  </td>
</tr>
